<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>全图展示 - 徐玉华</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f4f4;
        }
        
        .header {
            background-color: #fff;
            padding: 30px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            text-align: center;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        .gallery-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        .current-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .current-image {
            width: 100%;
            max-width: 900px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .current-image:hover {
            transform: scale(1.01);
        }
        
        .image-info {
            text-align: center;
            color: #666;
            font-size: 1.1em;
        }
        
        .navigation {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin: 20px 0;
        }
        
        .nav-btn {
            padding: 12px 25px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1em;
            transition: background-color 0.3s;
        }
        
        .nav-btn:hover {
            background-color: #2980b9;
        }
        
        .nav-btn:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        
        .page-indicator {
            font-size: 1.2em;
            color: #2c3e50;
            font-weight: bold;
        }
        
        .thumbnail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .thumbnail {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 5px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: border-color 0.3s, transform 0.3s;
        }
        
        .thumbnail:hover {
            transform: scale(1.05);
            border-color: #3498db;
        }
        
        .thumbnail.active {
            border-color: #e74c3c;
        }
        
        /* 图片放大查看模态框 */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
        }
        
        .modal-image {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 5px;
        }
        
        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            color: white;
            font-size: 36px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1001;
        }
        
        .close-modal:hover {
            color: #f1f1f1;
        }
        
        .modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(255,255,255,0.1);
            color: white;
            border: none;
            padding: 15px 20px;
            cursor: pointer;
            font-size: 20px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        
        .modal-nav:hover {
            background-color: rgba(255,255,255,0.3);
        }
        
        .modal-prev {
            left: 20px;
        }
        
        .modal-next {
            right: 20px;
        }
        
        .modal-info {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 1.2em;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .header {
                padding: 20px 15px;
                margin-bottom: 15px;
            }
            
            h1 {
                font-size: 1.5em;
                padding-bottom: 8px;
            }
            
            .gallery-container {
                padding: 20px 15px;
            }
            
            .current-image {
                max-width: 100%;
                border-radius: 8px;
            }
            
            .navigation {
                flex-direction: column;
                gap: 12px;
                margin: 15px 0;
            }
            
            .nav-btn {
                padding: 10px 20px;
                font-size: 1em;
                width: 120px;
            }
            
            .page-indicator {
                font-size: 1em;
            }
            
            .image-info {
                font-size: 1em;
            }
            
            .thumbnail-grid {
                grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
                gap: 10px;
                margin-top: 20px;
                padding-top: 15px;
            }
            
            .thumbnail {
                height: 70px;
                border-width: 2px;
            }
            
            .modal-nav {
                padding: 8px 12px;
                font-size: 16px;
                background-color: rgba(255,255,255,0.2);
            }
            
            .close-modal {
                font-size: 30px;
                top: 10px;
                right: 10px;
            }
            
            .modal-info {
                font-size: 1em;
                bottom: 10px;
            }
            
            .modal-content {
                max-width: 95%;
                max-height: 85%;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 5px;
            }
            
            .header {
                padding: 15px 10px;
            }
            
            h1 {
                font-size: 1.3em;
            }
            
            .gallery-container {
                padding: 15px 10px;
            }
            
            .nav-btn {
                padding: 8px 16px;
                font-size: 0.9em;
                width: 100px;
            }
            
            .page-indicator {
                font-size: 0.9em;
            }
            
            .thumbnail-grid {
                grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
                gap: 8px;
            }
            
            .thumbnail {
                height: 60px;
            }
            
            .modal-nav {
                padding: 6px 10px;
                font-size: 14px;
            }
            
            .modal-prev {
                left: 10px;
            }
            
            .modal-next {
                right: 10px;
            }
            
            .close-modal {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>全图展示</h1>
        <p style="text-align: center; color: #666;">展示所有图片，共30张，每页一张，点击图片可放大查看。</p>
        <a href="index.html" class="back-link">← 返回个人简历</a>
    </div>
    
    <div class="gallery-container">
        <div class="current-view">
            <img id="currentImage" class="current-image" src="" alt="图片">
            <div id="imageInfo" class="image-info">图片 1 / 30</div>
            
            <div class="navigation">
                <button id="prevBtn" class="nav-btn">上一张</button>
                <span id="pageIndicator" class="page-indicator">第 1 页，共 30 页</span>
                <button id="nextBtn" class="nav-btn">下一张</button>
            </div>
        </div>
        
        <div class="thumbnail-grid" id="thumbnailContainer">
            <!-- 缩略图将由JavaScript动态生成 -->
        </div>
    </div>
    
    <!-- 图片放大查看模态框 -->
    <div id="imageModal" class="image-modal">
        <span class="close-modal" id="closeModal">&times;</span>
        <button class="modal-nav modal-prev" id="modalPrevBtn">‹</button>
        <div class="modal-content">
            <img id="modalImage" class="modal-image" src="" alt="大图">
            <div id="modalInfo" class="modal-info">图片 1 / 30</div>
        </div>
        <button class="modal-nav modal-next" id="modalNextBtn">›</button>
    </div>
    
    <script>
        // 所有图片列表
        const allImages = [
            // 烹饪图片 (9张)
            'image/pr/01.jpg',
            'image/pr/02.jpg',
            'image/pr/03.jpg',
            'image/pr/04.jpg',
            'image/pr/05.jpg',
            'image/pr/06.jpg',
            'image/pr/07.jpg',
            'image/pr/08.jpg',
            'image/pr/09.jpg',
            
            // Report目录图片 (7张)
            'Report/1.jpg',
            'Report/2.jpg',
            'Report/3.jpg',
            'Report/4.jpg',
            'Report/5.jpg',
            'Report/6.jpg',
            'Report/7.jpg',
            
            // Report2025目录图片 (10张)
            'Report2025/report_page-0001.jpg',
            'Report2025/report_page-0002.jpg',
            'Report2025/report_page-0003.jpg',
            'Report2025/report_page-0004.jpg',
            'Report2025/report_page-0005.jpg',
            'Report2025/report_page-0006.jpg',
            'Report2025/report_page-0007.jpg',
            'Report2025/report_page-0008.jpg',
            'Report2025/report_page-0009.jpg',
            'Report2025/report_page-0010.jpg',
            
            // Report2026目录图片 (4张)
            'Report2026/Report_page-0001.jpg',
            'Report2026/Report_page-0003.jpg',
            'Report2026/Report_page-0004.jpg',
            'Report2026/Report_page-0005.jpg',
            'Report2026/Report_page-0006.jpg',
            'Report2026/Report_page-0008.jpg',
            'Report2026/Report_page-0009.jpg',
            'Report2026/Reportpage-0002.jpg',
            'Report2026/Reportpage-0007.jpg'
        ];
        
        // 获取DOM元素
        const currentImage = document.getElementById('currentImage');
        const imageInfo = document.getElementById('imageInfo');
        const pageIndicator = document.getElementById('pageIndicator');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const thumbnailContainer = document.getElementById('thumbnailContainer');
        
        // 模态框相关元素
        const imageModal = document.getElementById('imageModal');
        const closeModal = document.getElementById('closeModal');
        const modalImage = document.getElementById('modalImage');
        const modalInfo = document.getElementById('modalInfo');
        const modalPrevBtn = document.getElementById('modalPrevBtn');
        const modalNextBtn = document.getElementById('modalNextBtn');
        
        // 当前图片索引
        let currentIndex = 0;
        
        // 初始化页面
        function initGallery() {
            updateImage();
            createThumbnails();
            updateNavigation();
        }
        
        // 更新当前显示的图片
        function updateImage() {
            currentImage.src = allImages[currentIndex];
            currentImage.alt = `图片 ${currentIndex + 1}`;
            imageInfo.textContent = `图片 ${currentIndex + 1} / ${allImages.length}`;
            pageIndicator.textContent = `第 ${currentIndex + 1} 页，共 ${allImages.length} 页`;
            
            // 更新缩略图激活状态
            document.querySelectorAll('.thumbnail').forEach((thumb, index) => {
                if (index === currentIndex) {
                    thumb.classList.add('active');
                } else {
                    thumb.classList.remove('active');
                }
            });
            
            // 保存当前索引到本地存储
            localStorage.setItem('fullGalleryCurrentIndex', currentIndex);
        }
        
        // 创建缩略图
        function createThumbnails() {
            thumbnailContainer.innerHTML = '';
            
            allImages.forEach((imageSrc, index) => {
                const thumbnail = document.createElement('img');
                thumbnail.src = imageSrc;
                thumbnail.alt = `缩略图 ${index + 1}`;
                thumbnail.className = 'thumbnail';
                if (index === currentIndex) {
                    thumbnail.classList.add('active');
                }
                
                thumbnail.addEventListener('click', () => {
                    currentIndex = index;
                    updateImage();
                    updateNavigation();
                });
                
                thumbnailContainer.appendChild(thumbnail);
            });
        }
        
        // 更新导航按钮状态
        function updateNavigation() {
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === allImages.length - 1;
        }
        
        // 上一张图片
        function prevImage() {
            if (currentIndex > 0) {
                currentIndex--;
                updateImage();
                updateNavigation();
            }
        }
        
        // 下一张图片
        function nextImage() {
            if (currentIndex < allImages.length - 1) {
                currentIndex++;
                updateImage();
                updateNavigation();
            }
        }
        
        // 打开图片放大模态框
        function openImageModal() {
            modalImage.src = allImages[currentIndex];
            modalImage.alt = `大图 ${currentIndex + 1}`;
            modalInfo.textContent = `图片 ${currentIndex + 1} / ${allImages.length}`;
            imageModal.style.display = 'flex';
            
            // 更新模态框导航按钮状态
            modalPrevBtn.disabled = currentIndex === 0;
            modalNextBtn.disabled = currentIndex === allImages.length - 1;
        }
        
        // 关闭图片放大模态框
        function closeImageModal() {
            imageModal.style.display = 'none';
        }
        
        // 在模态框中上一张图片
        function modalPrevImage() {
            if (currentIndex > 0) {
                currentIndex--;
                modalImage.src = allImages[currentIndex];
                modalImage.alt = `大图 ${currentIndex + 1}`;
                modalInfo.textContent = `图片 ${currentIndex + 1} / ${allImages.length}`;
                
                // 更新主图
                updateImage();
                updateNavigation();
                
                // 更新模态框导航按钮状态
                modalPrevBtn.disabled = currentIndex === 0;
                modalNextBtn.disabled = currentIndex === allImages.length - 1;
            }
        }
        
        // 在模态框中下一张图片
        function modalNextImage() {
            if (currentIndex < allImages.length - 1) {
                currentIndex++;
                modalImage.src = allImages[currentIndex];
                modalImage.alt = `大图 ${currentIndex + 1}`;
                modalInfo.textContent = `图片 ${currentIndex + 1} / ${allImages.length}`;
                
                // 更新主图
                updateImage();
                updateNavigation();
                
                // 更新模态框导航按钮状态
                modalPrevBtn.disabled = currentIndex === 0;
                modalNextBtn.disabled = currentIndex === allImages.length - 1;
            }
        }
        
        // 键盘导航支持
        document.addEventListener('keydown', (event) => {
            if (imageModal.style.display === 'flex') {
                // 模态框打开时的键盘导航
                if (event.key === 'ArrowLeft') {
                    modalPrevImage();
                } else if (event.key === 'ArrowRight') {
                    modalNextImage();
                } else if (event.key === 'Escape') {
                    closeImageModal();
                }
            } else {
                // 主页面键盘导航
                if (event.key === 'ArrowLeft') {
                    prevImage();
                } else if (event.key === 'ArrowRight') {
                    nextImage();
                }
            }
        });
        
        // 事件监听
        prevBtn.addEventListener('click', prevImage);
        nextBtn.addEventListener('click', nextImage);
        currentImage.addEventListener('click', openImageModal);
        closeModal.addEventListener('click', closeImageModal);
        modalPrevBtn.addEventListener('click', modalPrevImage);
        modalNextBtn.addEventListener('click', modalNextImage);
        
        // 点击模态框背景关闭模态框
        imageModal.addEventListener('click', (event) => {
            if (event.target === imageModal) {
                closeImageModal();
            }
        });
        
        // 从本地存储恢复之前的浏览位置
        const savedIndex = localStorage.getItem('fullGalleryCurrentIndex');
        if (savedIndex !== null) {
            const index = parseInt(savedIndex);
            if (!isNaN(index) && index >= 0 && index < allImages.length) {
                currentIndex = index;
            }
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initGallery);
    </script>
</body>
</html>
